<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天使戰隊 RTS</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="setup" class="setup">
  <section class="hero">
    <h1>天使戰隊 RTS<small>試玩版</small></h1>
    <p>中世紀即時戰略。蓋經濟、出兵、互相拆家——由各家 AI 寫出的選手在這裡對決，你也可以親自上場或在旁觀戰。</p>
    <div class="row">
      <button id="tutorial" class="primary" type="button">開始新手教學</button>
      <span class="muted small">第一次玩？跟著 9 個步驟學會基本操作，對手不會反擊（約 5～10 分鐘）</span>
    </div>
  </section>
  <section class="card">
    <h2>開始對局</h2>
    <div class="modes" id="modes">
      <label class="mode-tile new"><input type="radio" name="mode" value="sc1v1"><span class="t" data-icon="flag">觀戰 搶點 1v1</span><span class="d">搶控制點、控制過半就倒數獲勝</span><span class="tag">新模式</span></label>
      <label class="mode-tile new"><input type="radio" name="mode" value="sc4"><span class="t" data-icon="flag">觀戰 搶點 4 人</span><span class="d">四種不同打法的搶點 Bot 混戰</span><span class="tag">新模式</span></label>
      <label class="mode-tile new"><input type="radio" name="mode" value="hc1v1"><span class="t" data-icon="flag">搶點 1v1 對戰</span><span class="d">你 vs 搶點 Bot</span><span class="tag">新模式</span></label>
      <label class="mode-tile"><input type="radio" name="mode" value="h1v1" checked><span class="t" data-icon="spear">1v1 對戰</span><span class="d">你 vs 基準 Bot</span></label>
      <label class="mode-tile"><input type="radio" name="mode" value="h4"><span class="t" data-icon="army">4 人混戰</span><span class="d">你 vs 3 個基準 Bot</span></label>
      <label class="mode-tile"><input type="radio" name="mode" value="h8"><span class="t" data-icon="army">8 人混戰</span><span class="d">你 vs 7 個基準 Bot</span><span class="tag">提案</span></label>
      <label class="mode-tile"><input type="radio" name="mode" value="s1v1"><span class="t" data-icon="watchtower">觀戰 1v1</span><span class="d">基準 Bot vs 基準 Bot</span></label>
      <label class="mode-tile"><input type="radio" name="mode" value="s1v1r"><span class="t" data-icon="watchtower">觀戰 1v1</span><span class="d">基準 Bot vs 隨機 Bot</span></label>
      <label class="mode-tile"><input type="radio" name="mode" value="s4"><span class="t" data-icon="watchtower">觀戰 4 人</span><span class="d">基準 Bot × 4</span></label>
      <label class="mode-tile"><input type="radio" name="mode" value="s8"><span class="t" data-icon="watchtower">觀戰 8 人</span><span class="d">基準 Bot × 8</span><span class="tag">提案</span></label>
    </div>
    <div class="row">
      <label>地圖 Seed <input id="seed" type="number" min="0" step="1"></label>
      <button id="reroll" type="button">隨機</button>
      <label class="muted small"><input id="limit" type="checkbox"> 套用與 AI 選手相同的指令額度（每秒 5 個）</label>
    </div>
    <button id="start" class="primary" type="button">開始</button>
  </section>
  <section class="card">
    <h2>回放播放器</h2>
    <p class="muted">載入 <code>rts-sim match --replay-dir</code> 產生的回放檔，或對局結束後下載的回放。</p>
    <input id="replayFile" type="file" accept=".json,application/json">
  </section>
  <section class="card" id="helpCard">
    <h2>遊戲說明</h2>
    <div class="help-tabs"></div>
    <div class="help-content"></div>
  </section>
</div>
<div id="game" class="game hidden"></div>
<script type="module" src="../src/web/main.ts"></script>
</body>
</html>
