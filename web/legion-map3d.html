<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>軍團戰 地圖 3D 預覽</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d10; --panel: rgba(16, 19, 24, 0.86); --line: #2a3038; --text: #e6e9ee; --muted: #8b95a3; --accent: #d9b36c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .panel { position: fixed; top: 12px; left: 12px; width: 300px; max-width: calc(100vw - 24px); padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
  .panel h1 { margin: 0 0 8px; font-size: 16px; }
  .panel select { width: 100%; padding: 4px 6px; background: #151a20; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .panel label.chk { display: flex; gap: 6px; align-items: center; margin-top: 6px; cursor: pointer; }
  .panel p { margin: 8px 0 0; color: var(--muted); font-size: 12.5px; }
  .panel .row { display: flex; gap: 6px; margin-top: 8px; }
  .panel button { flex: 1; padding: 4px 0; background: #151a20; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; cursor: pointer; }
  .panel button:hover { border-color: var(--accent); }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .tag { position: absolute; transform: translate(-50%, -100%); padding: 1px 6px; border-radius: 4px; background: rgba(10, 12, 15, 0.72); color: #f1e6cf; font-size: 12px; white-space: nowrap; }
  .tag.flag { background: rgba(120, 30, 30, 0.85); color: #fff; font-weight: 600; }
  #status { position: fixed; right: 12px; bottom: 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>
<div class="panel">
  <h1>地圖 3D 預覽</h1>
  <select id="map"></select>
  <label class="chk"><input type="checkbox" id="names" checked>地標名稱</label>
  <label class="chk"><input type="checkbox" id="deploy">布陣區（藍攻、紅守）</label>
  <div class="row"><button type="button" data-cam="top">俯視</button><button type="button" data-cam="tilt">斜視</button><button type="button" data-cam="low">低角度</button></div>
  <p>左鍵拖曳旋轉、滾輪縮放、右鍵拖曳平移。純看地圖，沒有軍團；高度有誇大，一階約半格高。</p>
  <p id="desc"></p>
</div>
<div id="status">載入中…</div>
<script type="module" src="../src/web/legion/map3d.js"></script>
</body>
</html>
