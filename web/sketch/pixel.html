<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>草圖 B：霓虹像素</title>
<style>
@font-face { font-family: "Cubic11"; src: url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@main/fonts/web/Cubic_11.woff2") format("woff2"); font-display: block; }
:root { --bg: #120b2a; --bg2: #1d1240; --ink: #f5f5f5; --dim: #8f88c0; --c: #00f0ff; --m: #ff2a6d; --y: #fcee0a; --g: #1de9b6; --p: #8c1eff; }
* { box-sizing: border-box; }
body { margin: 0; width: 1440px; height: 900px; overflow: hidden; position: relative; background: var(--bg) radial-gradient(#2a1d5c 2px, transparent 2px) 0 0 / 16px 16px; color: var(--ink); font-family: "Cubic11", monospace; font-size: 22px; line-height: 1.5; -webkit-font-smoothing: none; image-rendering: pixelated; }
canvas { image-rendering: pixelated; display: block; }
.crt { position: absolute; inset: 0; z-index: 40; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 2px, transparent 2px 4px), radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55)); }
.win { position: absolute; z-index: 2; background: var(--bg2); padding: 20px 24px;
  clip-path: polygon(8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px), 0 8px, 4px 8px, 4px 4px, 8px 4px);
  box-shadow: inset 0 0 0 4px var(--ink), inset 0 0 0 8px #3b2c78; }
.win.c { box-shadow: inset 0 0 0 4px var(--c), inset 0 0 0 8px #0b4a63; }
.win.m { box-shadow: inset 0 0 0 4px var(--m), inset 0 0 0 8px #5e1430; }
.win.y { box-shadow: inset 0 0 0 4px var(--y), inset 0 0 0 8px #5e5410; }
.tt { position: absolute; top: 2px; left: 20px; padding: 0 10px; background: var(--bg2); color: var(--y); font-size: 22px; line-height: 1; }
.glow-c { color: var(--c); text-shadow: 2px 2px 0 #0b4a63, -2px 0 0 rgba(0, 240, 255, 0.25); }
.glow-m { color: var(--m); text-shadow: 2px 2px 0 #5e1430; }
.glow-y { color: var(--y); text-shadow: 2px 2px 0 #5e5410; }
.dim { color: var(--dim); }
.big { font-size: 44px; line-height: 1.2; }
.huge { font-size: 88px; line-height: 1; }
/* 頂列 */
.top { left: 24px; top: 20px; width: 1392px; height: 84px; display: flex; align-items: center; gap: 28px; padding: 0 28px; }
.top .name { font-size: 33px; }
.top .sep { color: #3b2c78; }
.top .res { margin-left: auto; display: flex; gap: 28px; }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
/* 下一場 */
.match { left: 24px; top: 132px; width: 880px; height: 560px; padding: 36px 36px 28px; }
.vs { display: grid; grid-template-columns: 1fr 200px 1fr; align-items: center; text-align: center; margin-top: 4px; }
.vs .side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.vs .side canvas { filter: drop-shadow(4px 4px 0 #000); }
.vs .vsx { font-size: 88px; color: var(--y); text-shadow: 4px 4px 0 var(--m), 8px 8px 0 #000; }
.line { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 26px; }
.pc { position: relative; display: grid; grid-template-columns: 104px 1fr; gap: 12px; align-items: center; padding: 12px; background: #120b2a; box-shadow: inset 0 0 0 4px #3b2c78; }
.pc canvas { box-shadow: 0 0 0 4px #000; }
.pc .slot { position: absolute; left: 8px; top: -16px; padding: 0 8px; background: var(--y); color: #120b2a; }
.pc .nm { font-size: 22px; }
.pc .rt { font-size: 33px; }
.go { display: flex; gap: 20px; align-items: center; margin-top: 30px; }
.btn { padding: 12px 28px; background: var(--y); color: #120b2a; font-size: 33px; box-shadow: 8px 8px 0 #000, inset -4px -4px 0 #b8a800; }
.btn2 { padding: 12px 20px; background: #120b2a; color: var(--c); font-size: 22px; box-shadow: inset 0 0 0 4px var(--c), 8px 8px 0 #000; }
/* 選單 */
.menu { left: 936px; top: 132px; width: 480px; height: 360px; padding: 32px 32px; }
.menu div { padding: 2px 12px; display: flex; justify-content: space-between; }
.menu div.on { background: var(--c); color: #120b2a; }
.menu div .k { color: var(--dim); }
.menu div.on .k { color: #0b4a63; }
.menu .new { color: var(--m); }
/* 排名 */
.rank { left: 936px; top: 520px; width: 480px; height: 172px; padding: 26px 28px 20px; font-size: 22px; }
.rank .r { display: grid; grid-template-columns: 44px 1fr 44px; }
.rank .r.me { color: var(--y); }
/* 對話框 */
.talk { left: 24px; top: 720px; width: 1392px; height: 156px; display: flex; gap: 24px; align-items: center; padding: 20px 28px; }
.talk canvas { box-shadow: 0 0 0 4px var(--ink), 8px 8px 0 #000; }
.talk .who { color: var(--g); }
.talk .arrow { margin-left: auto; align-self: flex-end; color: var(--y); }
.note { position: absolute; z-index: 60; right: 30px; bottom: 0; font-size: 22px; color: rgba(255, 255, 255, 0.45); }
</style>
</head>
<body>
<div class="win top c">
  <canvas data-pix-crest="天使戰隊" data-px="16" data-scale="4"></canvas>
  <span class="name glow-c">天使戰隊</span><span class="sep">■</span>
  <span>第 4 週 <span class="dim">例行賽</span></span>
  <div class="res"><span class="glow-y">＄104.8萬</span><span class="glow-c">★10</span><span class="glow-m">⌛7週</span></div>
</div>
<div class="win match y">
  <span class="tt">下一場 NEXT MATCH</span>
  <div class="vs">
    <div class="side"><canvas data-pix-crest="天使戰隊" data-px="24" data-scale="5"></canvas><span class="big glow-c">天使戰隊</span><span class="dim">戰力 1492</span></div>
    <div><div class="vsx blink">VS</div><div class="glow-y">押你贏×2.00</div></div>
    <div class="side"><canvas data-pix-crest="暗影工作室" data-px="24" data-scale="5"></canvas><span class="big glow-m">暗影工作室</span><span class="dim">戰力 1510</span></div>
  </div>
  <div class="line">
    <div class="pc"><span class="slot">先鋒</span><canvas data-pix-avatar="xzr" data-px="26" data-scale="4"></canvas><div><div class="nm">謝子睿</div><div class="dim">強攻流v3</div><div class="rt glow-c">1518</div></div></div>
    <div class="pc"><span class="slot">中堅</span><canvas data-pix-avatar="qmz2" data-px="26" data-scale="4"></canvas><div><div class="nm">邱明哲</div><div class="dim">均衡流v2</div><div class="rt glow-c">1478</div></div></div>
    <div class="pc"><span class="slot">大將</span><canvas data-pix-avatar="xce" data-px="26" data-scale="4"></canvas><div><div class="nm">徐承恩</div><div class="dim">龜守流v2</div><div class="rt glow-c">1479</div></div></div>
  </div>
  <div class="go"><span class="btn"><span class="blink">▶</span> 進入比賽日</span><span class="btn2">調整名單</span></div>
</div>
<div class="win menu m">
  <span class="tt">選單</span>
  <div class="on"><span>▶ 戰隊</span><span class="k">4/5</span></div>
  <div><span>　 轉會市場</span><span class="k">3人</span></div>
  <div><span>　 訓練基地</span><span class="k">200場</span></div>
  <div><span>　 聯賽</span><span class="k">第7名</span></div>
  <div><span>　 賭盤</span><span class="k">4場</span></div>
  <div><span>　 財務</span><span class="k glow-m">-14.6</span></div>
  <div><span>　 信件</span><span class="new">NEW 3</span></div>
</div>
<div class="win rank c">
  <span class="tt">排行</span>
  <div class="r"><span>01</span><span>鐵壁電競</span><span>9</span></div>
  <div class="r"><span>02</span><span>北辰戰隊</span><span>9</span></div>
  <div class="r me"><span>07</span><span>天使戰隊</span><span>3</span></div>
</div>
<div class="win talk">
  <canvas data-pix-avatar="assistant-lin" data-jersey="#1de9b6" data-px="26" data-scale="4"></canvas>
  <div><div class="who">助理　小林</div><div>經理，暗影工作室的大將換人了。<br>要派球探去看看嗎？</div></div>
  <span class="arrow blink">▼</span>
</div>
<div class="crt"></div>
<div class="note">草圖 B・霓虹像素（非實際畫面）</div>
<script type="module" src="../../src/web/sketch/fill.ts"></script>
</body>
</html>
