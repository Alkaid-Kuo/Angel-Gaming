<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設計稿 B：黃昏商店街</title>
<link rel="stylesheet" href="./stage.css">
<style>
@font-face { font-family: "Cubic11"; src: url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@main/fonts/web/Cubic_11.woff2") format("woff2"); font-display: block; }
/* 像素格＝4px（背景是 480×270 放大 4 倍）；字用 11 的整數倍（22／33／44）。
   暮色限色盤：靛藍、灰紫、米白為主；珊瑚只給選中與開戰；薄荷是我方；杏色只在夕陽與燈光 */
#stage { --K: #0f1020; --I: #1b1d33; --J: #2a2b4a; --G: #3b3552; --U: #5a5070; --V: #7a6a9a; --S: #8a8aa0; --T: #b9b4c0; --C: #e8dcc4; --W: #fff6e0; --R: #e8735a; --D: #b5503f; --A: #f2a65a; --M: #7cc4a8; --N: #3f7f78; --P: #c9a1b4;
  font-family: "Cubic11", monospace; font-size: 22px; line-height: 1.5; color: var(--C); -webkit-font-smoothing: none; image-rendering: pixelated; background: var(--I); }
canvas { image-rendering: pixelated; display: block; }
#bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.crt { position: absolute; inset: 0; z-index: 40; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(15, 16, 32, 0.16) 0 2px, transparent 2px 4px), radial-gradient(ellipse at center, transparent 62%, rgba(15, 16, 32, 0.55)); }

/* 像素視窗：階梯圓角＋雙色框＋硬陰影 */
.sh { position: absolute; z-index: 2; filter: drop-shadow(8px 8px 0 rgba(15, 16, 32, 0.75)); }
.win { position: relative; background: var(--I); padding: 24px 28px 20px; box-shadow: inset 0 0 0 4px var(--bc, var(--C)), inset 0 0 0 8px var(--bc2, var(--G));
  clip-path: polygon(8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px), 0 8px, 4px 8px, 4px 4px, 8px 4px); }
.win .tt { position: absolute; left: 24px; top: 0; padding: 0 12px; line-height: 1.2; background: var(--bc, var(--C)); color: var(--I); }
.dim { color: var(--S); }
.mint { color: var(--M); }
.blink { animation: blink 1s steps(1) infinite; }

/* 頂列 */
.top { left: 24px; top: 16px; width: 1872px; }
.top .win { height: 80px; display: flex; align-items: center; gap: 24px; padding: 0 32px; background: rgba(27, 29, 51, 0.92); }
.top .nm { font-size: 44px; line-height: 1; color: var(--C); text-shadow: 4px 4px 0 var(--K); }
.top .wk { color: var(--T); }
.top .wk b { font-weight: 400; color: var(--M); }
.top .res { margin-left: auto; display: flex; gap: 40px; align-items: center; }
.top .res span { display: flex; align-items: center; gap: 10px; font-size: 33px; line-height: 1; }

/* 街上的招牌（跟著街屋層視差；選中的是珊瑚色） */
.street { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.sign { top: 466px; pointer-events: auto; cursor: pointer; }
.sign .win { padding: 16px 16px 12px; text-align: center; --bc2: var(--J); background: var(--J); }
.sign .hd { display: flex; align-items: center; justify-content: center; gap: 12px; }
.sign b { font-weight: 400; font-size: 33px; line-height: 1.1; color: var(--C); }
.sign em { display: block; margin-top: 4px; font-style: normal; color: var(--T); }
.sign:hover .win, .sign.on .win { --bc: var(--R); --bc2: var(--D); background: var(--G); }
.sign:hover b, .sign.on b { color: var(--W); }
.sign.on em { color: var(--A); }
.cursor { position: absolute; left: 50%; top: -48px; margin-left: -11px; font-size: 33px; line-height: 1; color: var(--R); text-shadow: 4px 4px 0 var(--K); animation: hop 0.8s steps(2) infinite; }
@keyframes hop { 50% { transform: translateY(-8px); } }

/* 街口布條 */
.banner { left: 752px; top: 320px; width: 416px; z-index: 3; filter: drop-shadow(0 8px 0 rgba(15, 16, 32, 0.55)); animation: sway 3.2s steps(2) infinite; transform-origin: 50% 0; }
@keyframes sway { 50% { transform: translateY(4px); } }
.banner .cloth { position: relative; padding: 16px 24px 32px; background: var(--C); color: var(--I); text-align: center; box-shadow: inset 0 0 0 4px var(--T), inset 0 0 0 8px var(--C), inset 0 0 0 12px var(--G);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 87.5% calc(100% - 16px), 75% 100%, 62.5% calc(100% - 16px), 50% 100%, 37.5% calc(100% - 16px), 25% 100%, 12.5% calc(100% - 16px), 0 100%); }
.banner .row { display: flex; align-items: center; justify-content: center; gap: 20px; }
.banner h1 { margin: 0; font-weight: 400; font-size: 44px; line-height: 1.1; letter-spacing: 0.1em; color: var(--I); }
.banner .vs { margin-top: 6px; font-size: 22px; color: var(--G); }
.banner .vs i { font-style: normal; color: var(--D); margin: 0 6px; }
.banner .ring { position: absolute; top: -8px; width: 8px; height: 12px; background: var(--S); }

/* 下方：出賽名單、開戰、助理對話 */
.party { left: 24px; top: 836px; width: 620px; }
.party .win { --bc: var(--M); --bc2: var(--N); display: flex; gap: 8px; padding: 40px 20px 18px; }
.party .tt { color: var(--K); }
.pl { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pl canvas { box-shadow: 0 0 0 4px var(--C), 6px 6px 0 4px var(--K); }
.pl .slot { margin-top: 10px; padding: 0 8px; background: var(--M); color: var(--K); line-height: 1.3; }
.pl b { font-weight: 400; font-size: 33px; line-height: 1.1; }
.pl .bar { display: flex; gap: 4px; }
.pl .bar i { width: 12px; height: 8px; background: var(--G); }
.pl .bar i.f { background: var(--M); }
.pl .rt { color: var(--T); }

.go { position: absolute; z-index: 3; left: 960px; top: 862px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.go .odds { padding: 0 12px; background: var(--I); color: var(--T); box-shadow: 4px 4px 0 var(--K); }
.go .odds b { font-weight: 400; color: var(--A); }
.go .btn { margin-top: 20px; padding: 12px 36px; font-size: 44px; line-height: 1.1; color: var(--I); background: var(--R); cursor: pointer;
  box-shadow: 8px 8px 0 var(--K), inset -4px -4px 0 var(--D), inset 4px 4px 0 var(--A); }
.go .btn:hover { background: var(--A); }
.go .key { margin-top: 16px; color: var(--C); text-shadow: 4px 4px 0 var(--K); }

.talk { right: 24px; top: 836px; width: 620px; }
.talk .win { display: flex; gap: 24px; padding: 28px 28px 20px; }
.talk canvas { flex: none; box-shadow: 0 0 0 4px var(--C), 6px 6px 0 4px var(--K); }
.talk .who { color: var(--M); }
.talk p { margin: 2px 0 0; font-size: 33px; line-height: 1.3; }
.talk .opts { display: flex; gap: 16px; margin-top: 12px; }
.talk .opts span { padding: 0 12px; background: var(--J); box-shadow: inset 0 0 0 4px var(--S); color: var(--T); }
.talk .opts span.on { box-shadow: inset 0 0 0 4px var(--R); color: var(--W); }
.talk .arrow { position: absolute; right: 24px; bottom: 16px; color: var(--R); }

/* 進場：像素感的跳格動畫 */
.in { animation: popin 0.5s steps(5) both; animation-delay: var(--d, 0s); }
@keyframes popin { from { opacity: 0; translate: 0 32px; } }
.banner.in { animation: drop 0.6s steps(6) both, sway 3.2s steps(2) 0.6s infinite; animation-delay: var(--d, 0s), calc(var(--d, 0s) + 0.6s); }
@keyframes drop { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
</style>
</head>
<body>
<div id="vp"><div id="stage">
  <canvas id="bg" width="480" height="270"></canvas>

  <section class="street">
    <div class="sh sign in" style="left:60px;width:216px;--d:.5s"><div class="win"><div class="hd"><span data-px-icon="coin"></span><b>財務</b></div><em>−14.6萬／週</em></div></div>
    <div class="sh sign in" style="left:324px;width:200px;--d:.55s"><div class="win"><div class="hd"><span data-px-icon="scroll"></span><b>市場</b></div><em>3 名新人</em></div></div>
    <div class="sh sign on in" style="left:556px;width:184px;--d:.6s"><span class="cursor">▼</span><div class="win"><div class="hd"><span data-px-icon="flag"></span><b>戰隊</b></div><em>4／5 已排</em></div></div>
    <div class="sh sign in" style="left:1180px;width:184px;--d:.65s"><div class="win"><div class="hd"><span data-px-icon="cup"></span><b>聯賽</b></div><em>第 7 名</em></div></div>
    <div class="sh sign in" style="left:1396px;width:216px;--d:.7s"><div class="win"><div class="hd"><span data-px-icon="bell"></span><b>訓練</b></div><em>200／200</em></div></div>
    <div class="sh sign in" style="left:1652px;width:216px;--d:.75s"><div class="win"><div class="hd"><span data-px-icon="dice"></span><b>賭盤</b></div><em>4 場開盤</em></div></div>
    <div class="sh banner in" style="--d:.3s"><div class="cloth">
      <div class="row"><canvas data-pix-crest="天使戰隊" data-px="14" data-scale="4"></canvas><h1>比賽日</h1><canvas data-pix-crest="暗影工作室" data-px="14" data-scale="4"></canvas></div>
      <div class="vs">天使戰隊<i>VS</i>暗影工作室</div>
    </div></div>
  </section>

  <div class="sh top in"><div class="win">
    <canvas data-pix-crest="天使戰隊" data-px="14" data-scale="4"></canvas>
    <span class="nm">天使戰隊</span>
    <span class="wk"><b>第 4 週</b>　例行賽</span>
    <div class="res"><span><span data-px-icon="coin" data-k="4"></span>104.8萬</span><span class="mint">★ 10</span><span style="color:var(--T)">⌛ 7週</span><span style="color:var(--P)">✉ 3</span></div>
  </div></div>

  <div class="sh party in" style="--d:.8s"><div class="win"><span class="tt">出賽名單</span>
    <div class="pl"><canvas data-pix-avatar="xzr" data-jersey="#3f7f78" data-px="20" data-scale="4"></canvas><span class="slot">先鋒</span><b>謝子睿</b><span class="rt">1518</span><div class="bar"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i></div></div>
    <div class="pl"><canvas data-pix-avatar="qmz2" data-jersey="#3f7f78" data-px="20" data-scale="4"></canvas><span class="slot">中堅</span><b>邱明哲</b><span class="rt">1478</span><div class="bar"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i></div></div>
    <div class="pl"><canvas data-pix-avatar="xce" data-jersey="#3f7f78" data-px="20" data-scale="4"></canvas><span class="slot">大將</span><b>徐承恩</b><span class="rt">1479</span><div class="bar"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i></div></div>
  </div></div>

  <div class="go in" style="--d:.95s">
    <span class="odds">押你贏 <b>×2.00</b>　對手名單 ？？？</span>
    <span class="btn"><span class="blink">▶</span> 開戰！</span>
    <span class="key blink">按 ENTER</span>
  </div>

  <div class="sh talk in" style="--d:.9s"><div class="win">
    <canvas data-pix-avatar="assistant-lin" data-jersey="#7cc4a8" data-px="24" data-scale="4"></canvas>
    <div><div class="who">助理　小林</div><p>暗影的大將換人了。<br>要派球探去看看嗎？</p>
      <div class="opts"><span class="on">▶ 派球探（1萬）</span><span>算了</span></div></div>
    <span class="arrow blink">▼</span>
  </div></div>

  <div class="crt"></div>
  <div class="design-note" style="right:36px;top:104px;z-index:50">設計稿 B · 黃昏商店街</div>
</div></div>
<script type="module" src="../../src/web/sketch/pixel.ts"></script>
<script type="module" src="../../src/web/sketch/fill.ts"></script>
</body>
</html>
