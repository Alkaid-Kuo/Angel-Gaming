<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI：比賽結果</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="../stage.css">
<link rel="stylesheet" href="../angel.css">
<link rel="stylesheet" href="./ui.css">
<style>
/* 比賽結果：中央超大 WIN 與比分，兩側隊徽；下方三個對位結果；最下面一排是這場帶來的變化 */
.hud { position: absolute; left: 56px; right: 56px; top: 34px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 14px; letter-spacing: 0.3em; color: var(--grey); }
.hud b { color: var(--gold2); font-weight: 400; }
.flare { position: absolute; left: 50%; top: 300px; width: 1400px; height: 520px; margin-left: -700px; background: radial-gradient(closest-side, rgba(var(--gold-rgb), 0.28), transparent); pointer-events: none; }
.big { position: absolute; left: 0; right: 0; top: 96px; text-align: center; transform: translate(calc(var(--mx) * -12px), calc(var(--my) * -6px)); }
.big .huge { display: block; font-size: 330px; letter-spacing: 0.04em; color: var(--gold); text-shadow: 0 0 80px rgba(var(--gold-rgb), 0.55), 0 12px 0 rgba(0, 0, 0, 0.4); }
.big .zh { display: inline-block; margin-top: 4px; font-size: 52px; font-weight: 900; letter-spacing: 0.6em; margin-right: -0.6em; transform: skewX(-7deg); }
.vsrow { position: absolute; left: 50%; top: 520px; transform: translateX(-50%); display: flex; align-items: center; gap: 40px; }
.vsrow .t { display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 900; letter-spacing: 0.08em; }
.vsrow .t.r { flex-direction: row-reverse; }
.vsrow .sc { font-family: var(--en); font-style: italic; font-weight: 800; font-size: 84px; line-height: 1; }
.vsrow .sc b { color: var(--gold); }
.vsrow .sc i { font-style: normal; color: var(--grey2); margin: 0 12px; }

.bouts { position: absolute; left: 240px; right: 240px; top: 650px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.bt3 { position: relative; display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 12px; height: 96px; padding: 0 18px; background: var(--panel); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
.bt3 .av { width: 54px; height: 54px; }
.bt3 .c { text-align: center; }
.bt3 .c small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.3em; color: var(--grey); }
.bt3 .c b { font-size: 20px; font-weight: 900; letter-spacing: 0.06em; }
.bt3 .c b i { font-style: normal; color: var(--grey2); margin: 0 8px; font-family: var(--en); }
.bt3 .stamp { position: absolute; right: 74px; top: -4px; font-size: 20px; padding: 2px 12px; }
.bt3.w { box-shadow: inset 0 0 0 2px var(--gold); background: linear-gradient(115deg, rgba(var(--gold-rgb), 0.18), rgba(var(--gold-rgb), 0) 50%), var(--panel); }
.bt3.l .av:first-child { filter: grayscale(1) brightness(0.7); }

.gains { position: absolute; left: 240px; right: 240px; top: 790px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.gn { padding: 16px 18px; background: rgba(255, 255, 255, 0.04); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12); }
.gn.g { box-shadow: inset 0 2px 0 var(--gold); }
.gn small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; color: var(--grey); }
.gn .v { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.gn .v .num { font-size: 44px; line-height: 1; }
.gn .v span { font-size: 15px; color: var(--grey); }
.gn .v .num.up { color: var(--gold2); }
.gn p { margin: 6px 0 0; font-size: 13px; color: var(--grey); }
.ctl { position: absolute; right: 56px; bottom: 40px; display: flex; gap: 14px; }
.cap { position: absolute; left: 56px; bottom: 50px; font-size: 15px; color: var(--grey); }
</style>
</head>
<body>
<div id="vp"><div id="stage" data-screen="result" data-word="VICTORY" data-shell="none">
  <div class="flare"></div>
  <div class="hud in"><span>W04 <b>//</b> 中央競技場 <b>//</b> 例行賽</span><span>FINAL · 3 場對位結束</span></div>

  <section class="big in pop" style="--d:.15s"><span class="huge">WIN</span><span class="zh">勝利</span></section>
  <section class="vsrow in" style="--d:.35s">
    <div class="t"><span class="cr" style="width:80px;height:80px"><span data-crest="天使戰隊" data-size="52"></span></span>天使戰隊</div>
    <div class="sc"><b>2</b><i>:</i>1</div>
    <div class="t r"><span class="cr foe" style="width:80px;height:80px"><span data-crest="暗影工作室" data-foe data-size="52"></span></span><span class="rd">暗影工作室</span></div>
  </section>

  <section class="bouts">
    <div class="bt3 w in" style="--d:.5s"><span class="av tinted"><span data-avatar="xzr" data-size="54"></span></span><span class="c"><small>01 先鋒</small><b>謝子睿<i>vs</i>洪立安</b></span><span class="av foe tinted"><span data-avatar="hla" data-size="54"></span></span><span class="stamp w">WIN</span></div>
    <div class="bt3 l in" style="--d:.58s"><span class="av tinted"><span data-avatar="qmz2" data-size="54"></span></span><span class="c"><small>02 中堅</small><b>邱明哲<i>vs</i>曾柏翰</b></span><span class="av foe tinted"><span data-avatar="cbh" data-size="54"></span></span><span class="stamp l">LOSE</span></div>
    <div class="bt3 w in" style="--d:.66s"><span class="av tinted"><span data-avatar="xce" data-size="54"></span></span><span class="c"><small>03 大將</small><b>徐承恩<i>vs</i>廖芷晴</b></span><span class="av foe tinted"><span data-avatar="lzq" data-size="54"></span></span><span class="stamp w">WIN</span></div>
  </section>

  <section class="gains">
    <div class="gn g in" style="--d:.8s"><small>比賽收入</small><div class="v"><span class="num up">+16.0</span><span>萬</span></div><p>勝 12 萬 ＋ 對位勝 2 場 × 2 萬</p></div>
    <div class="gn g in" style="--d:.86s"><small>下注開獎</small><div class="v"><span class="num up">+10.0</span><span>萬</span></div><p>押天使 ×2.00 · 下注 5 萬</p></div>
    <div class="gn in" style="--d:.92s"><small>名氣</small><div class="v"><span class="num">10</span><span>→</span><span class="num up">12</span></div><p>每週贊助 8.0 → 9.6 萬</p></div>
    <div class="gn in" style="--d:.98s"><small>積分</small><div class="v"><span class="num">3</span><span>→</span><span class="num up">6</span></div><p>跟暗影同分，比勝場差</p></div>
    <div class="gn in" style="--d:1.04s"><small>評分</small><div class="v"><span class="num up">+9</span><span>/ −7 / +11</span></div><p>先鋒 · 中堅 · 大將</p></div>
  </section>

  <div class="cap in" style="--d:1.1s">徐承恩的龜守流拖到後期，大將戰逆轉。</div>
  <div class="ctl in" style="--d:1.1s"><a class="btn ghost"><b>看其他賽場</b></a><a class="btn" href="week.html"><b>週結算</b><span>NEXT</span></a></div>
</div></div>
<script type="module" src="../../../src/web/sketch/ui.ts"></script>
</body>
</html>
